name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # Runs alongside `checks`, not after it.
  #
  # Without ACTIONS_ID_TOKEN_REQUEST_URL npm cannot mint an OIDC token, skips
  # Trusted Publishing silently, and reports ENEEDAUTH — an error naming the
  # symptom and not the cause. Learning that took a ten-minute test suite twice,
  # because the only place it could be observed was after the gate. It is a
  # precondition of the release, so it belongs at the front of it.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Trusted Publishing requires npm >= 11.5.1 and an OIDC token
        run: |
          echo "npm: $(npm --version)"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_URL is MISSING: id-token write did not reach this job" >&2
            exit 1
          fi
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: set"

  publish:
    needs: [checks, preflight]
    runs-on: ubuntu-latest
    # Declared on the job as well as at the top level. npm 11.19.0 supports
    # Trusted Publishing and still went straight to ENEEDAUTH, which is what it
    # does when the OIDC request variables GitHub injects for `id-token: write`
    # are absent — so the permission not reaching this job is the hypothesis, and
    # stating it here removes the variable instead of arguing about precedence.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      # No `registry-url`: it makes setup-node write an .npmrc carrying
      # `_authToken=${NODE_AUTH_TOKEN}` and set that variable to the literal
      # placeholder `XXXXX-XXXXX-XXXXX-XXXXX`. npm then sees credentials already
      # configured, never attempts the OIDC exchange Trusted Publishing needs,
      # sends the bogus token, and the registry answers 404 — which is what it
      # returns instead of 403 for a scoped package. registry.npmjs.org is the
      # default registry anyway, so the line bought nothing and cost the release.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag matches package.json version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Determine npm dist-tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-alpha* ]]; then
            echo "npm_tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *-beta* ]]; then
            echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *-rc* ]]; then
            echo "npm_tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      # `--provenance` is not passed: Trusted Publishing attaches provenance on
      # its own, and requesting it explicitly is what let the previous run print
      # a signed provenance statement while the publish itself was unauthenticated
      # — a log that looked like success up to the last line.
      #
      # Trusted Publishing needs npm >= 11.5.1, so the version is printed: when
      # this fails again, the log should say which of the two things was missing.
      # `--loglevel verbose` is deliberate, and stays.
      #
      # ENEEDAUTH is what npm reports whether it never attempted the OIDC
      # exchange or attempted it and was refused, so at the default log level the
      # two causes are indistinguishable — and one is a workflow bug while the
      # other is a setting on npmjs.com that no amount of workflow editing fixes.
      # Three release attempts were spent on that ambiguity. Verbose shows the
      # request; it does not print the token.
      - name: Publish to npm via Trusted Publishing
        env:
          NPM_TAG: ${{ steps.tag.outputs.npm_tag }}
        run: npm publish --access public --tag "$NPM_TAG" --loglevel verbose

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NPM_TAG: ${{ steps.tag.outputs.npm_tag }}
        run: |
          PRERELEASE=""
          if [ "$NPM_TAG" != "latest" ]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE
